<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Create User</h2>

        <form id="createUserForm" class="space-y-4">
            <!-- Username -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" name="username" required class="w-full px-3 py-2 border rounded-md">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-3 py-2 border rounded-md">
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" class="w-full px-3 py-2 border rounded-md">
            </div>

            <!-- Full Name -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="fullName" name="fullName" class="w-full px-3 py-2 border rounded-md">
            </div>

            <!-- Role -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Role</label>
                <select id="role" name="role" required class="w-full px-3 py-2 border rounded-md">
                    <option value="admin">Admin</option>
                    <option value="moderator">Moderator</option>
                    <option value="parent">Parent</option>
                </select>
            </div>

            <!-- Admin-Specific Fields -->
            <div id="adminFields">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Subdomain</label>
                    <input type="text" id="subdomain" name="subdomain" class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">School Name</label>
                    <input type="text" id="schoolName" name="schoolName" class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Website</label>
                    <input type="text" id="website" name="website" class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Contact Number</label>
                    <input type="text" id="contactNumber" name="contactNumber" class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Address</label>
                    <input type="text" id="address" name="address" class="w-full px-3 py-2 border rounded-md">
                </div>

                <!-- Logo URL -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Logo URL</label>
                    <input type="text" id="logo" name="logo" class="w-full px-3 py-2 border rounded-md">
                </div>

                <!-- QR Code URL (Read-only, generated if Website is provided) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">QR Code URL (Auto-generated)</label>
                    <input type="text" id="qrCodeUrl" name="qrCodeUrl" class="w-full px-3 py-2 border rounded-md bg-gray-100" readonly>
                </div>
            </div>

            <!-- Submit Button -->
            <button id="submit-btn" class="w-full bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">Create User</button>
        </form>

        <!-- Message Display -->
        <div id="message" class="text-center text-sm mt-3"></div>
    </div>

    <script>
        document.getElementById("role").addEventListener("change", function () {
            document.getElementById("adminFields").style.display = this.value === "admin" ? "block" : "none";
        });

        document.getElementById("website").addEventListener("input", function () {
            const websiteUrl = this.value.trim();
            if (websiteUrl) {
                document.getElementById("qrCodeUrl").value = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(websiteUrl)}`;
            } else {
                document.getElementById("qrCodeUrl").value = "";
            }
        });

        document.getElementById("submit-btn").addEventListener("click", async function (event) {

            event.preventDefault();
            
            const formData = {
                username: document.getElementById("username").value,
                password: document.getElementById("password").value,
                email: document.getElementById("email").value,
                fullName: document.getElementById("fullName").value,
                role: document.getElementById("role").value,
                subdomain: document.getElementById("role").value === "admin" ? document.getElementById("subdomain").value : null,
                schoolName: document.getElementById("role").value === "admin" ? document.getElementById("schoolName").value : null,
                website: document.getElementById("role").value === "admin" ? document.getElementById("website").value : null,
                contactNumber: document.getElementById("role").value === "admin" ? document.getElementById("contactNumber").value : null,
                address: document.getElementById("role").value === "admin" ? document.getElementById("address").value : null,
                logo: document.getElementById("role").value === "admin" ? document.getElementById("logo").value : null,
                qrCodeUrl: document.getElementById("role").value === "admin" ? document.getElementById("qrCodeUrl").value : null
            };

            console.log("Submitting User Data:", formData);

            try {
                const response = await fetch("http://localhost:4000/api/user/addUser", { // Change this URL to match your backend
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById("message").textContent = "User Created Successfully!";
                    document.getElementById("message").classList.add("text-green-600");
                    document.getElementById("createUserForm").reset();
                } else {
                    document.getElementById("message").textContent = result.message || "Error creating user.";
                    document.getElementById("message").classList.add("text-red-600");
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("message").textContent = "Server error, please try again.";
                document.getElementById("message").classList.add("text-red-600");
            }
        });
    </script>

</body>
</html>
